name: Release preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gate
      - run: mkdir -p artifacts
      - run: npm pack --pack-destination artifacts
      - run: npm sbom --sbom-format cyclonedx > artifacts/alembic-0.1.0.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: alembic-release-preflight
          path: artifacts/
          if-no-files-found: error
