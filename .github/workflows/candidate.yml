name: Candidate dry run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gate
      - run: npm run candidate
        env:
          SEEDBED_CANDIDATE: ${{ vars.SEEDBED_CANDIDATE }}
          SEEDBED_CANDIDATE_SHA256: ${{ vars.SEEDBED_CANDIDATE_SHA256 }}
          WORKSHOP_CANDIDATE: ${{ vars.WORKSHOP_CANDIDATE }}
          WORKSHOP_CANDIDATE_SHA256: ${{ vars.WORKSHOP_CANDIDATE_SHA256 }}
          LEGACY_CANDIDATE: "@gnolith/codex-plugin@0.2.0"
          LEGACY_CANDIDATE_SHA256: ${{ vars.LEGACY_CANDIDATE_SHA256 }}
      - uses: actions/upload-artifact@v4
        with:
          name: alembic-candidate
          path: artifacts/
          if-no-files-found: error
